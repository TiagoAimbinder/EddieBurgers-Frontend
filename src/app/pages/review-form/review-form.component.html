<main>
  <section>
    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="fr">
      <div class="cont-title">
        <h1 class="title">¡Dejanos tu reseña!</h1>
        <p class="text">Tu opinión nos importa</p>
      </div>

      <div class="cont-row">
      <!-- ========== INPUT NOMBRE ========== -->
        <div class="cont">
          <div class="cont-title-inp">
            <svg class="icon-inp" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12.1601 10.87C12.0601 10.86 11.9401 10.86 11.8301 10.87C9.45006 10.79 7.56006 8.84 7.56006 6.44C7.56006 3.99 9.54006 2 12.0001 2C14.4501 2 16.4401 3.99 16.4401 6.44C16.4301 8.84 14.5401 10.79 12.1601 10.87Z" stroke="#171717" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.15997 14.56C4.73997 16.18 4.73997 18.82 7.15997 20.43C9.90997 22.27 14.42 22.27 17.17 20.43C19.59 18.81 19.59 16.17 17.17 14.56C14.43 12.73 9.91997 12.73 7.15997 14.56Z" stroke="#171717" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 class="title-inp">Nombre</h3>
          </div>
          <label for="nombre" class="lb">
            <input id="nombre" formControlName="userxr_name" placeholder="Tu nombre completo" type="text" class="inp">
          </label>
        </div>
      </div>

      <div class="cont-row">
        <!-- ========== INPUT PHONE ========== -->
        <div class="cont">
          <div class="cont-title-inp">
            <svg class="icon-inp" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.971 17.33C20.971 17.69 20.891 18.06 20.721 18.42C20.551 18.78 20.331 19.12 20.041 19.44C19.551 19.98 19.011 20.37 18.401 20.62C17.801 20.87 17.151 21 16.451 21C15.431 21 14.341 20.76 13.191 20.27C12.041 19.78 10.891 19.12 9.75098 18.29C8.60098 17.45 7.51098 16.52 6.47098 15.49C5.44098 14.45 4.51098 13.36 3.68098 12.22C2.86098 11.08 2.20098 9.94 1.72098 8.81C1.24098 7.67 1.00098 6.58 1.00098 5.54C1.00098 4.86 1.12098 4.21 1.36098 3.61C1.60098 3 1.98098 2.44 2.51098 1.94C3.15098 1.31 3.85098 1 4.59098 1C4.87098 1 5.15098 1.06 5.40098 1.18C5.66098 1.3 5.89098 1.48 6.07098 1.74L8.39098 5.01C8.57098 5.26 8.70098 5.49 8.79098 5.71C8.88098 5.92 8.93098 6.13 8.93098 6.32C8.93098 6.56 8.86098 6.8 8.72098 7.03C8.59098 7.26 8.40098 7.5 8.16098 7.74L7.40098 8.53C7.29098 8.64 7.24098 8.77 7.24098 8.93C7.24098 9.01 7.25098 9.08 7.27098 9.16C7.30098 9.24 7.33098 9.3 7.35098 9.36C7.53098 9.69 7.84098 10.12 8.28098 10.64C8.73098 11.16 9.21098 11.69 9.73098 12.22C10.271 12.75 10.791 13.24 11.321 13.69C11.841 14.13 12.271 14.43 12.611 14.61C12.661 14.63 12.721 14.66 12.791 14.69C12.871 14.72 12.951 14.73 13.041 14.73C13.211 14.73 13.341 14.67 13.451 14.56L14.211 13.81C14.461 13.56 14.701 13.37 14.931 13.25C15.161 13.11 15.391 13.04 15.641 13.04C15.831 13.04 16.031 13.08 16.251 13.17C16.471 13.26 16.701 13.39 16.951 13.56L20.261 15.91C20.521 16.09 20.701 16.3 20.811 16.55C20.911 16.8 20.971 17.05 20.971 17.33Z" stroke="#171717" stroke-width="1.5" stroke-miterlimit="10"/>
            </svg>

            <h3 class="title-inp">Teléfono</h3>
          </div>
          <label for="telefono" class="lb">
            <input id="telefono" formControlName="userxr_phone" placeholder="+353 000 0000" type="text" class="inp">
          </label>
        </div>
      </div>

      <div class="cont-row">
      <!-- ========== INPUT EMAIL ========== -->
        <div class="cont">
          <div class="cont-title-inp">
            <svg class="icon-inp" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17 20.5H7C4 20.5 2 19 2 15.5V8.5C2 5 4 3.5 7 3.5H17C20 3.5 22 5 22 8.5V15.5C22 19 20 20.5 17 20.5Z" stroke="#171717" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M17 9L13.87 11.5C12.84 12.32 11.15 12.32 10.12 11.5L7 9" stroke="#171717" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 class="title-inp">Email</h3>
          </div>
          <label for="email" class="lb">
            <input id="email" formControlName="userxr_email" placeholder="eddie@burgers.com" type="email" class="inp">
          </label>
        </div>
      </div>

      <div class="cont-row">
        <!-- ========== INPUT MENÚ ========== -->
        <div class="cont">
            <div class="cont-title-inp">
              <svg class="icon-inp" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 18H19.75H19ZM5 14.584H5.75C5.75 14.2859 5.57345 14.016 5.30028 13.8967L5 14.584ZM19 14.584L18.6997 13.8967C18.4265 14.016 18.25 14.2859 18.25 14.584H19ZM15.75 7C15.75 7.41421 16.0858 7.75 16.5 7.75C16.9142 7.75 17.25 7.41421 17.25 7H15.75ZM6.75 7C6.75 7.41421 7.08579 7.75 7.5 7.75C7.91421 7.75 8.25 7.41421 8.25 7H6.75ZM7 4.25C3.82436 4.25 1.25 6.82436 1.25 10H2.75C2.75 7.65279 4.65279 5.75 7 5.75V4.25ZM17 5.75C19.3472 5.75 21.25 7.65279 21.25 10H22.75C22.75 6.82436 20.1756 4.25 17 4.25V5.75ZM15 21.25H9V22.75H15V21.25ZM9 21.25C8.03599 21.25 7.38843 21.2484 6.90539 21.1835C6.44393 21.1214 6.24643 21.0142 6.11612 20.8839L5.05546 21.9445C5.51093 22.4 6.07773 22.5857 6.70552 22.6701C7.31174 22.7516 8.07839 22.75 9 22.75V21.25ZM4.25 18C4.25 18.9216 4.24841 19.6883 4.32991 20.2945C4.41432 20.9223 4.59999 21.4891 5.05546 21.9445L6.11612 20.8839C5.9858 20.7536 5.87858 20.5561 5.81654 20.0946C5.75159 19.6116 5.75 18.964 5.75 18H4.25ZM18.25 18C18.25 18.964 18.2484 19.6116 18.1835 20.0946C18.1214 20.5561 18.0142 20.7536 17.8839 20.8839L18.9445 21.9445C19.4 21.4891 19.5857 20.9223 19.6701 20.2945C19.7516 19.6883 19.75 18.9216 19.75 18H18.25ZM15 22.75C15.9216 22.75 16.6883 22.7516 17.2945 22.6701C17.9223 22.5857 18.4891 22.4 18.9445 21.9445L17.8839 20.8839C17.7536 21.0142 17.5561 21.1214 17.0946 21.1835C16.6116 21.2484 15.964 21.25 15 21.25V22.75ZM7 5.75C7.2137 5.75 7.42326 5.76571 7.6277 5.79593L7.84703 4.31205C7.57021 4.27114 7.28734 4.25 7 4.25V5.75ZM12 1.25C9.68949 1.25 7.72942 2.7421 7.02709 4.81312L8.44763 5.29486C8.94981 3.81402 10.3516 2.75 12 2.75V1.25ZM7.02709 4.81312C6.84722 5.34352 6.75 5.91118 6.75 6.5H8.25C8.25 6.07715 8.3197 5.67212 8.44763 5.29486L7.02709 4.81312ZM17 4.25C16.7127 4.25 16.4298 4.27114 16.153 4.31205L16.3723 5.79593C16.5767 5.76571 16.7863 5.75 17 5.75V4.25ZM12 2.75C13.6484 2.75 15.0502 3.81402 15.5524 5.29486L16.9729 4.81312C16.2706 2.7421 14.3105 1.25 12 1.25V2.75ZM15.5524 5.29486C15.6803 5.67212 15.75 6.07715 15.75 6.5H17.25C17.25 5.91118 17.1528 5.34352 16.9729 4.81312L15.5524 5.29486ZM5.75 18V14.584H4.25V18H5.75ZM5.30028 13.8967C3.79769 13.2402 2.75 11.7416 2.75 10H1.25C1.25 12.359 2.6705 14.3846 4.69972 15.2712L5.30028 13.8967ZM18.25 14.584L18.25 18H19.75L19.75 14.584H18.25ZM21.25 10C21.25 11.7416 20.2023 13.2402 18.6997 13.8967L19.3003 15.2712C21.3295 14.3846 22.75 12.359 22.75 10H21.25ZM15.75 6.5V7H17.25V6.5H15.75ZM6.75 6.5V7H8.25V6.5H6.75Z" fill="#1C274C"/>
                <path d="M5 18H19" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <h3 class="title-inp">Elegí tu menú</h3>
            </div>
            <select class="lb sel" formControlName="men_id">
              <option class="lb" value="" disabled selected>Selecciona un menú</option>
              <option class="lb" *ngFor="let m of menus" [value]="m.men_id">{{ m.men_name }}</option>
            </select>
        </div>

        <div class="cont">
          <div class="cont-title-inp">
            <svg class="icon-inp" width="25" height="24" viewBox="0 0 25 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13.7457 3.51001L15.5057 7.03001C15.7457 7.52002 16.3857 7.99001 16.9257 8.08001L20.1157 8.61001C22.1557 8.95001 22.6357 10.43 21.1657 11.89L18.6857 14.37C18.2657 14.79 18.0357 15.6 18.1657 16.18L18.8757 19.25C19.4357 21.68 18.1457 22.62 15.9957 21.35L13.0057 19.58C12.4657 19.26 11.5757 19.26 11.0257 19.58L8.03566 21.35C5.89566 22.62 4.59566 21.67 5.15566 19.25L5.86566 16.18C5.99566 15.6 5.76566 14.79 5.34566 14.37L2.86566 11.89C1.40566 10.43 1.87566 8.95001 3.91566 8.61001L7.10566 8.08001C7.63566 7.99001 8.27566 7.52002 8.51566 7.03001L10.2757 3.51001C11.2357 1.60001 12.7957 1.60001 13.7457 3.51001Z" stroke="#171717" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <h3 class="title-inp">Puntaje</h3>
          </div>
          <select class="lb sel" formControlName="mxr_star">
            <option class="lb" value="" disabled selected>Selecciona un puntaje</option>
            <option [value]="1">⭐</option>
            <option [value]="2">⭐⭐</option>
            <option [value]="3">⭐⭐⭐</option>
            <option [value]="4">⭐⭐⭐⭐</option>
            <option [value]="5">⭐⭐⭐⭐⭐</option>
          </select>
        </div>
      </div>

      <div class="cont-row">
        <div class="cont">
          <div class="cont-title-inp">
          <svg class="icon-inp" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 6.25V11.35C22 12.62 21.58 13.69 20.83 14.43C20.09 15.18 19.02 15.6 17.75 15.6V17.41C17.75 18.09 16.99 18.5 16.43 18.12L15.46 17.48C15.55 17.17 15.59 16.83 15.59 16.47V12.4C15.59 10.36 14.23 9 12.19 9H5.39999C5.25999 9 5.13 9.01002 5 9.02002V6.25C5 3.7 6.7 2 9.25 2H17.75C20.3 2 22 3.7 22 6.25Z" stroke="#171717" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M15.59 12.4V16.47C15.59 16.83 15.55 17.17 15.46 17.48C15.09 18.95 13.87 19.87 12.19 19.87H9.47L6.45 21.88C6 22.19 5.39999 21.86 5.39999 21.32V19.87C4.37999 19.87 3.53 19.53 2.94 18.94C2.34 18.34 2 17.49 2 16.47V12.4C2 10.5 3.18 9.19002 5 9.02002C5.13 9.01002 5.25999 9 5.39999 9H12.19C14.23 9 15.59 10.36 15.59 12.4Z" stroke="#171717" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h3 class="title-inp">Mensaje (opcional)</h3>
        </div>
        <textarea placeholder="Escribinos tu mensaje" class="lb" formControlName="rev_message"></textarea>
        </div>
      </div>

      <div class="cont-row">
        <div class="cont">
          <button class="btn" type="submit" [disabled]="reviewForm.invalid">Enviar Reseña</button>
        </div>
      </div>
    </form>
  </section>
</main>
